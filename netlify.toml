[build]
  command = "npm run build && npm test && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Versioned media URLs must change whenever the content changes.
[[headers]]
  for = "/media/v1/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/og*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/media/v1/*/index.m3u8"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"

[[headers]]
  for = "/media/v1/*/*.ts"
  [headers.values]
    Content-Type = "video/mp2t"

[[headers]]
  for = "/media/v2/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
